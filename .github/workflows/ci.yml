name: Frontend CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      # SEC-002: la URL de backend en CI es local y ficticia. Los tests usan
      # MSW/mocks; el valor solo necesita ser una URL válida, nunca la de prod.
      - name: Test
        working-directory: client
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000/api/v1
        run: npm run test:run